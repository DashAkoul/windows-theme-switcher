<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Windows Theme Switcher</title>
    <!--
      NOTE: no CSP <meta> here on purpose. Tauri injects its own IPC
      bootstrap script; a meta CSP without a nonce blocks it, which leaves
      the webview blank (black). The CSP is configured in tauri.conf.json
      (app.security.csp) so Tauri can add the required nonces/hashes.

      The boot styles live in /boot.css (a real stylesheet) instead of an
      inline <style> block, which lets the CSP forbid inline styles.
    -->
    <link rel="stylesheet" href="/boot.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
