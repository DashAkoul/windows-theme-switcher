[package]
name = "windows-theme-switcher"
version = "2.1.0"
description = "One-click Windows Light/Dark theme switcher with system tray"
authors = ["DashAkoul"]
edition = "2021"
rust-version = "1.77.2"
license = "GPL-3.0-only"

[lib]
name = "windows_theme_switcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winreg = "0.55"

[dependencies.windows]
version = "0.61"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_System_LibraryLoader",
  "Win32_System_ProcessStatus",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
incremental = false
# Drop debug symbols from the shipped binary: smaller installer, fewer pages
# to map at startup.
strip = true

[features]
# The custom protocol is enabled automatically in release builds by tauri-build.
default = []
